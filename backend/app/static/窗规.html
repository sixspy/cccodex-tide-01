<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>窗规 · 潮切</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <aside class="侧轨">
      <div class="侧牌">潮切</div>
      <div class="侧副">物流网点轨迹 · 事件时关窗管道<br/>不是双轨对拍，也不是开腿成对</div>
      <div class="窗条" id="侧窗条">
        <div class="标">当前窗</div>
        <div class="号" id="侧窗号">加载中</div>
        <div class="时" id="侧窗时">—</div>
      </div>
      <div class="时轴">
        <div class="点"><b>装载</b>观测点入流</div>
        <div class="点"><b>入窗</b>事件时进缓冲</div>
        <div class="点"><b>关窗</b>物化切片账</div>
        <div class="点"><b>贯验</b>缓冲↔切片互证</div>
      </div>
      
      <nav class="侧链">
        <a href="/" >潮切台</a>
        <a href="/观测流.html" >观测流</a>
        <a href="/入窗缓冲.html" >入窗缓冲</a>
        <a href="/窗切片账.html" >窗切片账</a>
        <a href="/迟到匣.html" >迟到匣</a>
        <a href="/窗贯验.html" >窗贯验</a>
        <a href="/网点源.html" >网点源</a>
        <a href="/窗规.html" class="亮">窗规</a>
      </nav>

    </aside>
    <main class="主区">
      <header class="页头">
        <h1>窗规</h1>
        <p>当前窗号、窗起止、窗长秒。邻题可改日界/水位空桩，勿改坏默认样例窗。</p>
      </header>

      <section class="卷">
        <h2>窗规策略</h2>
        <p class="说明">出窗口径全局只贯彻一种：切流账册记出窗指纹并拒绝回刷；双写两轨把出窗点写进只读归档旁路。入窗裁决只认事件时。</p>
        <div class="阶段" id="策略卡"></div>
        <p class="说明" id="命运统计"></p>
      </section>
      <section class="卷">
        <h2>窗规原文</h2>
        <pre class="回执" id="规">加载中…</pre>
      </section>
      <section class="卷">
        <h2>空桩目录</h2>
        <p class="说明" id="空桩"></p>
        <div class="双栏">
          <p class="说明">窗规钉死当前窗。改时钟漂移属于空桩，不在基线默认路径。</p>
          <div class="侧注">子方向：采集入库编排。行业皮：物流网点轨迹。去皮：事件时关窗管道。</div>
        </div>
      </section>
      <script>
      (async () => {
        const 规 = await 潮切.getJSON("/api/窗规");
        document.getElementById("规").textContent = JSON.stringify(规, null, 2);
        const 卡 = document.getElementById("策略卡");
        const 口径 = 规["出窗口径"] || "切流账册";
        const 处置 = 规["切流处置"] || "进迟到匣";
        const 项 = [
          ["出窗口径", 口径, 口径 === "双写两轨" ? "出窗点进只读归档旁路，缓冲只含窗内点" : "出窗点记指纹，回刷拒，缓冲不涨"],
          ["切流处置", 处置, 处置 === "整票拒" ? "出窗点整票拒，不进迟到匣" : "出窗点进迟到匣，账册留拒因"],
          ["命运图例", "中文命运", "入缓冲→已入缓冲 · 迟到→已迟到 · 归档→已归档 · 整票拒/回刷拒→已驳回"],
        ];
        for (const [名, 值, 文] of 项) {
          const c = document.createElement("div");
          c.className = "阶卡";
          c.innerHTML = `<div class="序">${潮切.安全文本(名)}</div><b>${潮切.安全文本(值)}</b><span>${潮切.安全文本(文)}</span>`;
          卡.appendChild(c);
        }
        const 裁决 = await 潮切.getJSON("/api/入窗裁决");
        const 统 = {};
        for (const d of 裁决) 统[d.命运] = (统[d.命运] || 0) + 1;
        const 文 = Object.entries(统).map(([k, v]) => `${k} ${v} 笔`).join(" · ");
        document.getElementById("命运统计").textContent = 文 ? `裁决命运分布：${文}` : "尚无入窗裁决。";
        const s = await 潮切.getJSON("/api/空桩");
        document.getElementById("空桩").textContent = "空桩 " + s.条数 + "：" + (s.空桩 || []).join(" · ");
      })();
      </script>

    </main>
  </div>
  <script>
  (async () => {
    try {
      const o = await 潮切.getJSON("/api/概览");
      const r = o.窗规 || {};
      const el = document.getElementById("侧窗号");
      const tm = document.getElementById("侧窗时");
      if (el) el.textContent = r["当前窗号"] || "—";
      if (tm) tm.textContent = `${r["窗起"] || ""} → ${r["窗止"] || ""}`;
    } catch (e) {}
  })();
  </script>
</body>
</html>
