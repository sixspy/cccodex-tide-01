<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>迟到匣 · 潮切</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <aside class="侧轨">
      <div class="侧牌">潮切</div>
      <div class="侧副">物流网点轨迹 · 事件时关窗管道<br/>不是双轨对拍，也不是开腿成对</div>
      <div class="窗条" id="侧窗条">
        <div class="标">当前窗</div>
        <div class="号" id="侧窗号">加载中</div>
        <div class="时" id="侧窗时">—</div>
      </div>
      <div class="时轴">
        <div class="点"><b>装载</b>观测点入流</div>
        <div class="点"><b>入窗</b>事件时进缓冲</div>
        <div class="点"><b>关窗</b>物化切片账</div>
        <div class="点"><b>贯验</b>缓冲↔切片互证</div>
      </div>
      
      <nav class="侧链">
        <a href="/" >潮切台</a>
        <a href="/观测流.html" >观测流</a>
        <a href="/入窗缓冲.html" >入窗缓冲</a>
        <a href="/窗切片账.html" >窗切片账</a>
        <a href="/迟到匣.html" class="亮">迟到匣</a>
        <a href="/窗贯验.html" >窗贯验</a>
        <a href="/网点源.html" >网点源</a>
        <a href="/窗规.html" >窗规</a>
      </nav>

    </aside>
    <main class="主区">
      <header class="页头">
        <h1>迟到匣</h1>
        <p>事件时落在窗外的观测点旁路。基线当场进匣，不入缓冲。</p>
      </header>

      <section class="卷">
        <h2>出窗裁决卡</h2>
        <p class="说明">同一笔入窗裁决的中文命运：迟到 / 整票拒 / 回刷拒 / 归档，连同拒因或归档键。</p>
        <div class="阶段" id="卡"></div>
      </section>
      <section class="卷">
        <div class="表绕"><table><thead><tr><th>编号</th><th>事件编号</th><th>运单键</th><th>原因</th><th>事件时</th><th>形态</th></tr></thead><tbody id="表"></tbody></table></div>
      </section>
      <section class="卷"><div class="双栏"><p class="说明">迟到匣吃出窗事件。切流账册下出窗点进匣并记指纹；双写两轨下出窗点走只读归档旁路，不进匣。</p><div class="侧注">行业皮：物流网点。拓扑：单流入窗，不是双轨。</div></div></section>
      <script>
      (async () => {
        const rows = await 潮切.getJSON("/api/迟到匣");
        const tb = document.getElementById("表");
        if (!rows.length) { tb.innerHTML = `<tr><td colspan="6">${潮切.空态("迟到匣为空。回潮切台灌迟到样例。")}</td></tr>`; }
        for (const r of rows) {
          tb.appendChild(潮切.行(`<td>${r.编号}</td><td>${潮切.安全文本(r.事件编号)}</td><td>${潮切.安全文本(r.运单键)}</td><td>${潮切.徽章(r.原因,"警")}</td><td>${潮切.安全文本(r.事件时)}</td><td>${潮切.安全文本(r.裁决形态 || "—")}</td>`));
        }
        const 裁决 = (await 潮切.getJSON("/api/入窗裁决")).filter(d => d.命运 !== "入缓冲");
        const 卡 = document.getElementById("卡");
        if (!裁决.length) { 卡.innerHTML = 潮切.空态("尚无出窗裁决。灌出窗噪声样例后此处出卡。"); return; }
        for (const d of 裁决.slice(0, 12)) {
          const c = document.createElement("div");
          c.className = "阶卡";
          c.innerHTML = `<div class="序">${潮切.安全文本(d.形态标记)}</div><b>${潮切.安全文本(d.事件编号)}</b><span>${潮切.徽章(d.命运, d.命运 === "归档" ? "好" : "警")} ${潮切.安全文本(d.拒因或归档键 || "—")} · valid ${d.valid ? "✓" : "✗"}</span>`;
          卡.appendChild(c);
        }
      })();
      </script>

    </main>
  </div>
  <script>
  (async () => {
    try {
      const o = await 潮切.getJSON("/api/概览");
      const r = o.窗规 || {};
      const el = document.getElementById("侧窗号");
      const tm = document.getElementById("侧窗时");
      if (el) el.textContent = r["当前窗号"] || "—";
      if (tm) tm.textContent = `${r["窗起"] || ""} → ${r["窗止"] || ""}`;
    } catch (e) {}
  })();
  </script>
</body>
</html>
